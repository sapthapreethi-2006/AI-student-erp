spring.application.name=student-erp

# Datasource: prefer an explicit JDBC URL via env `SPRING_DATASOURCE_URL`.
# If not set, fall back to an in-memory H2 database so the app can run locally
# without a MySQL server. To use MySQL, set `SPRING_DATASOURCE_URL`,
# `SPRING_DATASOURCE_USERNAME` and `SPRING_DATASOURCE_PASSWORD` env vars.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:studentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}

server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:0.0.0.0}

spring.jpa.open-in-view=false
logging.level.org.hibernate=INFO
logging.level.org.springframework.orm.jpa=INFO

# ==============================
# Gemini AI Configuration
# ==============================

# Set your Gemini API key as an environment variable.
# Example (PowerShell):
# $env:GEMINI_API_KEY="YOUR_NEW_API_KEY"
gemini.api.key=${GEMINI_API_KEY}

# Gemini API URL
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent}